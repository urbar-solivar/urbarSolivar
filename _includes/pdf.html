{% if include.type == "link" %}
  <a href="https://drive.google.com/file/d/{{ include.id }}/view" target="_blank" class="pdf-link">
    Otvoriť PDF dokument (na Google Drive)
  </a>
{% else %}
  <div class="pdf-embed-wrapper" style="margin: 20px 0;">
    <iframe 
      src="https://drive.google.com/file/d/{{ include.id }}/preview" 
      width="100%" 
      height="600px" 
      frameborder="0" 
      allow="autoplay">
    </iframe>
  </div>
{% endif %}
